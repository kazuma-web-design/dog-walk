<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Walk - 愛犬との散歩管理</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 登録画面 -->
        <section id="registration-screen" class="screen">
            <header>
                <h1>わんこプロフィール登録</h1>
                <p>まずはあなたの愛犬について教えてね！</p>
            </header>
            
            <form id="profile-form">
                <div class="input-group">
                    <label for="dog-name">おなまえ</label>
                    <input type="text" id="dog-name" placeholder="ポチ" required>
                </div>

                <div class="input-group">
                    <label for="dog-breed">犬種</label>
                    <select id="dog-breed" required>
                        <option value="">選択してください</option>
                        <!-- JSで動的に追加 -->
                    </select>
                </div>

                <div class="input-group">
                    <label for="dog-weight">体重 (kg)</label>
                    <input type="number" id="dog-weight" step="0.1" placeholder="5.0" required>
                </div>

                <div class="input-group">
                    <label for="dog-age">年齢</label>
                    <input type="number" id="dog-age" placeholder="3" required>
                </div>

                <button type="submit" class="btn-primary">登録してはじめる</button>
            </form>
        </section>

        <!-- メイン画面（初期は非表示） -->
        <section id="main-screen" class="screen hidden">
            <!-- 後のステップで実装 -->
        </section>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
