<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Walk - 愛犬との散歩管理</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb347">
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div id="app">
        <!-- 登録画面 -->
        <section id="registration-screen" class="screen">
            <header>
                <h1>わんこプロフィール登録</h1>
                <p>まずはあなたの愛犬について教えてね！</p>
            </header>

            <form id="profile-form">
                <div class="input-group">
                    <label for="dog-name">おなまえ</label>
                    <input type="text" id="dog-name" placeholder="ポチ" required>
                </div>

                <div class="input-group">
                    <label for="dog-breed">犬種</label>
                    <select id="dog-breed" required>
                        <option value="">選択してください</option>
                        <!-- JSで動的に追加 -->
                    </select>
                </div>

                <div class="input-group">
                    <label for="dog-weight">体重 (kg)</label>
                    <input type="number" id="dog-weight" step="0.1" placeholder="5.0" required>
                </div>

                <div class="input-group">
                    <label for="dog-age">年齢</label>
                    <input type="number" id="dog-age" placeholder="3" required>
                </div>

                <button type="submit" class="btn-primary">登録してはじめる</button>
            </form>
        </section>

        <!-- メイン画面 -->
        <section id="main-screen" class="screen hidden">
            <header>
                <h1 id="display-dog-name">ポチ</h1>
                <p id="display-dog-info">柴犬 / 5.0kg</p>
            </header>

            <div class="stats-container">
                <div class="stat-card">
                    <span class="stat-label">今日の目標</span>
                    <span class="stat-value"><span id="target-calories">--</span> <small>kcal</small></span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">合計消費</span>
                    <span class="stat-value"><span id="total-burned">0</span> <small>kcal</small></span>
                </div>
            </div>

            <div class="action-menu">
                <h2>散歩に出かけよう！</h2>
                <div class="input-group">
                    <label for="walk-duration">散歩の時間 (分)</label>
                    <input type="number" id="walk-duration" placeholder="30">
                </div>
                <div class="input-group">
                    <label for="walk-intensity">散歩のつよさ</label>
                    <select id="walk-intensity">
                        <!-- breeds.js から動的に追加 -->
                    </select>
                </div>
                <button id="btn-generate-route" class="btn-primary">散歩ルートを提案！</button>
            </div>

            <!-- マップ表示エリア -->
            <div id="map-container" class="hidden">
                <div class="timer-display">
                    <p id="walk-timer">00:00:00</p>
                    <p><span id="live-calories">0</span> kcal 燃焼中!</p>
                </div>
                <div id="map"></div>
                <button id="btn-start-walk" class="btn-primary">散歩スタート！</button>
                <button id="btn-stop-walk" class="btn-primary hidden"
                    style="background: var(--accent-color);">散歩終了！</button>
            </div>

            <!-- 履歴セクション -->
            <div id="history-container">
                <h3>これまでの散歩</h3>
                <div id="history-list">
                    <!-- JSで動的に追加 -->
                    <p class="empty-msg">まだ散歩の記録がないよ</p>
                </div>
            </div>

            <div class="footer-note">
                <p>※カロリー計算は目安です</p>
            </div>
        </section>
    </div>
    <script src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>

</html>
